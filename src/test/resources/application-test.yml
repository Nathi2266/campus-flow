# Test Profile Configuration

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: com.h2database.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true

server:
  port: 8081

logging:
  level:
    root: WARN
    com.campusflow: DEBUG
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    enabled: false
