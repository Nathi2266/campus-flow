# Test Profile Configuration

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  h2:
    console:
      enabled: true

  flyway:
    enabled: false

jwt:
  secret: campusflow-test-secret-key-min-32-bytes!!
  allow-insecure-default: false

cors:
  allowed-origin-patterns: http://localhost:*

server:
  port: 8081

logging:
  level:
    root: WARN
    com.campusflow: DEBUG
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    enabled: false
