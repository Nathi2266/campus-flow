# Production Profile Configuration
# Required env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
# JWT_SECRET (>=32 chars), CORS_ALLOWED_ORIGIN_PATTERNS (exact origins preferred).

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.campusflow: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.security: WARN

jwt:
  secret: ${JWT_SECRET}
  allow-insecure-default: false

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
