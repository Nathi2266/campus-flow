# Development Profile Configuration
# Local-only defaults (weak passwords / insecure JWT) — never use for shared/prod.

spring:
  datasource:
    # Local default matches docker compose host port mapping (5433→5432) and DB name.
    # Override with SPRING_DATASOURCE_URL if your Postgres differs.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/campusflow}
    username: ${SPRING_DATASOURCE_USERNAME:campusflow}
    password: ${SPRING_DATASOURCE_PASSWORD:campusflow123}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: DEBUG
    com.campusflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:campusflow-dev-only-secret-key-min-32-chars!!}
  allow-insecure-default: true

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
