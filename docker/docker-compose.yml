services:
  postgres:
    image: postgres:15-alpine
    container_name: campusflow-postgres
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusflow123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusflow-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: campusflow-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campusflow
      SPRING_DATASOURCE_USERNAME: campusflow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-campusflow123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-campusflow-dev-secret-key-min-32-bytes!!}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
      SERVER_PORT: 8080
      # Default: empty campus — create your own data. Set CAMPUSFLOW_SEED_DEMO=true for optional demo pack.
      CAMPUSFLOW_SEED_DEMO: ${CAMPUSFLOW_SEED_DEMO:-false}
      CAMPUSFLOW_BOOTSTRAP_ENABLED: ${CAMPUSFLOW_BOOTSTRAP_ENABLED:-true}
      CAMPUSFLOW_BOOTSTRAP_ADMIN_EMAIL: ${CAMPUSFLOW_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      CAMPUSFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${CAMPUSFLOW_BOOTSTRAP_ADMIN_PASSWORD:-Admin123!}
      CAMPUSFLOW_BOOTSTRAP_ADMIN_FIRST_NAME: ${CAMPUSFLOW_BOOTSTRAP_ADMIN_FIRST_NAME:-System}
      CAMPUSFLOW_BOOTSTRAP_ADMIN_LAST_NAME: ${CAMPUSFLOW_BOOTSTRAP_ADMIN_LAST_NAME:-Admin}
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - campusflow-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: campusflow-frontend
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - campusflow-network
    restart: unless-stopped

networks:
  campusflow-network:
    driver: bridge

volumes:
  postgres_data:
